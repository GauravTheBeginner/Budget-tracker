name: CI

# When this workflow runs
on:
  pull_request:          # every PR (any target branch)
  push:
    branches: [main]     # and after merging to main
  workflow_dispatch:     # plus a manual "Run workflow" button in the Actions tab

# Cancel an older run for the same branch/PR when a newer commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read         # least privilege: this workflow only needs to read the code

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"     # same version as the Docker image
          cache: pip                 # reuse downloaded packages between runs
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github   # annotates errors inline on the PR

      - name: Run tests (pytest)
        run: pytest -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test       # only build the image if lint & tests passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                      # CI only verifies it builds; pushing comes in CD
          tags: budget-tracker:${{ github.sha }}
          cache-from: type=gha             # reuse Docker layers from previous runs
          cache-to: type=gha,mode=max
